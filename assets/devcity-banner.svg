<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Twilight Slate - Meio Termo Elegante) -->
    <linearGradient id="twilightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#152136"/>
      <stop offset="60%" stop-color="#1a273f"/>
      <stop offset="100%" stop-color="#121c2e"/>
    </linearGradient>

    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Sky Background (Meio Termo) -->
  <rect width="1000" height="320" fill="url(#twilightGrad)"/>

  <!-- Ground Plane (Slate Asphalt & Lawn) -->
  <rect y="210" width="1000" height="110" fill="#18243b"/>
  <rect y="238" width="1000" height="42" fill="#1e2c45"/>
  <line x1="0" y1="259" x2="1000" y2="259" stroke="#94a3b8" stroke-width="2" stroke-dasharray="16, 12"/>

  <!-- Modelos Arquitetônicos Detalhados (Não são só retângulos) -->
  <!-- 1. Praça com Lago Ornamental e Chafariz (0 Commits) -->
  <g transform="translate(50, 160)">
    <rect x="0" y="38" width="75" height="14" rx="2" fill="#22c55e"/>
    <!-- Lago Azul -->
    <ellipse cx="38" cy="45" rx="22" ry="7" fill="#0284c7" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Jato do Chafariz -->
    <line x1="38" y1="45" x2="38" y2="30" stroke="#bae6fd" stroke-width="2.5"/>
    <!-- Árvores -->
    <rect x="10" y="24" width="3" height="16" fill="#451a03"/>
    <circle cx="11.5" cy="18" r="12" fill="#16a34a"/>
    <rect x="62" y="28" width="3" height="12" fill="#451a03"/>
    <circle cx="63.5" cy="22" r="10" fill="#15803d"/>
  </g>

  <!-- 2. Villa Moderna com Telhado Inclinado, Varanda e Pérgola (1 a 3 Commits) -->
  <g transform="translate(160, 120)">
    <!-- Corpo -->
    <rect x="0" y="35" width="60" height="55" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Telhado de 2 águas com cumeeira -->
    <polygon points="-5,35 30,5 65,35" fill="#b45309"/>
    <rect x="42" y="12" width="8" height="25" fill="#334155"/>
    <!-- Pérgola de madeira lateral -->
    <line x1="60" y1="50" x2="80" y2="50" stroke="#a16207" stroke-width="2.5"/>
    <line x1="60" y1="58" x2="80" y2="58" stroke="#a16207" stroke-width="2.5"/>
    <line x1="60" y1="66" x2="80" y2="66" stroke="#a16207" stroke-width="2.5"/>
    <rect x="78" y="50" width="3" height="40" fill="#a16207"/>
    <!-- Janela com luz quente -->
    <rect x="12" y="48" width="16" height="18" rx="2" fill="#fef08a"/>
    <!-- Árvore no jardim -->
    <circle cx="92" cy="62" r="12" fill="#22c55e"/>
    <rect x="91" y="72" width="3" height="18" fill="#451a03"/>
  </g>

  <!-- 3. Edifício Comercial Contemporâneo com Marquise e Terraço (4 a 7 Commits) -->
  <g transform="translate(295, 75)">
    <!-- Marquise de entrada -->
    <rect x="8" y="122" width="26" height="4" fill="#64748b"/>
    <!-- Corpo envidraçado com brises estruturais -->
    <rect x="0" y="0" width="80" height="135" fill="#0284c7" stroke="#334155" stroke-width="2"/>
    <line x1="20" y1="0" x2="20" y2="135" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="40" y1="0" x2="40" y2="135" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="60" y1="0" x2="60" y2="135" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Lajes horizontais -->
    <line x1="0" y1="35" x2="80" y2="35" stroke="#e2e8f0" stroke-width="2.5"/>
    <line x1="0" y1="70" x2="80" y2="70" stroke="#e2e8f0" stroke-width="2.5"/>
    <line x1="0" y1="105" x2="80" y2="105" stroke="#e2e8f0" stroke-width="2.5"/>
    <!-- Rooftop Lounge com plantas -->
    <rect x="5" y="-6" width="70" height="6" fill="#22c55e"/>
    <circle cx="20" cy="-10" r="7" fill="#16a34a"/>
    <circle cx="60" cy="-10" r="7" fill="#16a34a"/>
  </g>

  <!-- 4. Arranha-Céu Escultural com Heliponto e Spire (8+ Commits) -->
  <g transform="translate(425, 20)">
    <!-- Base com colunas -->
    <rect x="0" y="55" width="95" height="135" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <rect x="15" y="70" width="65" height="110" fill="url(#glassGrad)"/>
    <!-- Torre superior escalonada -->
    <rect x="16" y="0" width="63" height="55" fill="url(#glassGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Heliponto no topo com 'H' -->
    <circle cx="47" cy="0" r="16" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="47" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">H</text>
    <!-- Antena Spire com beacon vermelho -->
    <line x1="72" y1="0" x2="72" y2="-24" stroke="#d97706" stroke-width="3"/>
    <circle cx="72" cy="-24" r="3" fill="#ef4444"/>
  </g>

  <!-- 5. Mais Edifícios e Casas à Direita para Compor a Cidade -->
  <g transform="translate(565, 80)">
    <rect x="0" y="0" width="75" height="130" fill="#0284c7" stroke="#334155" stroke-width="2"/>
    <line x1="25" y1="0" x2="25" y2="130" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="50" y1="0" x2="50" y2="130" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="5" y="-5" width="65" height="5" fill="#22c55e"/>
  </g>

  <g transform="translate(680, 125)">
    <rect x="0" y="30" width="55" height="55" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <polygon points="-4,30 27.5,2 59,30" fill="#b45309"/>
    <rect x="10" y="44" width="14" height="16" fill="#fef08a"/>
  </g>

  <g transform="translate(775, 135)">
    <rect x="0" y="28" width="52" height="47" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <polygon points="-4,28 26,0 56,28" fill="#334155"/>
  </g>

  <g transform="translate(865, 160)">
    <rect x="0" y="38" width="70" height="14" rx="2" fill="#22c55e"/>
    <ellipse cx="35" cy="45" rx="18" ry="6" fill="#0284c7"/>
    <circle cx="58" cy="22" r="11" fill="#16a34a"/>
  </g>

  <!-- PÓRTICO ELEVADO: APENAS O NOME DO MÊS (SEM "DISTRITO TAL") -->
  <g transform="translate(500, 20)">
    <rect x="-100" y="0" width="200" height="32" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#cardShadow)"/>
    <text x="0" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14.5" fill="#ffffff" text-anchor="middle" letter-spacing="2">
      OUTUBRO
    </text>
  </g>

  <!-- Title Badge Overlay no Rodapé (Clean e Discreto) -->
  <g transform="translate(500, 288)">
    <rect x="-310" y="-18" width="620" height="36" rx="6" fill="#162238" stroke="#38bdf8" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="0" y="6" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      🏙️ QA CITY 2026 // EXPLORAR NO NAVEGADOR ➔
    </text>
  </g>
</svg>

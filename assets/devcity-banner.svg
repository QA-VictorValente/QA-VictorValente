<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients (Formal, Clean Daylight & Slate) -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8f1fa"/>
      <stop offset="60%" stop-color="#d9e6f2"/>
      <stop offset="100%" stop-color="#cbdbe9"/>
    </linearGradient>

    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="1000" height="320" fill="url(#skyGrad)"/>

  <!-- Ground Plane (Warm Grass & Avenue) -->
  <rect y="210" width="1000" height="110" fill="#dae6f2"/>
  <rect y="235" width="1000" height="45" fill="#334155"/>
  <line x1="0" y1="257" x2="1000" y2="257" stroke="#ffffff" stroke-width="2" stroke-dasharray="16, 12"/>

  <!-- Architectural City Skyline (Formal, Diversified Architecture) -->
  <!-- 1. Praça com Árvores (0 Commits) -->
  <g transform="translate(60, 160)">
    <rect x="0" y="38" width="60" height="14" rx="2" fill="#86efac"/>
    <!-- Árvores -->
    <rect x="18" y="24" width="4" height="18" fill="#5c3818"/>
    <circle cx="20" cy="18" r="14" fill="#22c55e"/>
    <rect x="42" y="28" width="4" height="14" fill="#5c3818"/>
    <circle cx="44" cy="22" r="11" fill="#16a34a"/>
  </g>

  <!-- 2. Casas Residenciais com Telhado Gabled (1 a 3 Commits) -->
  <g transform="translate(160, 130)">
    <rect x="0" y="30" width="55" height="52" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <polygon points="-4,30 27.5,2 59,30" fill="#a84824"/>
    <rect x="20" y="52" width="15" height="30" fill="#85502c"/>
    <rect x="38" y="10" width="8" height="22" fill="#475569"/>
    <!-- Árvore ao lado -->
    <rect x="68" y="55" width="4" height="25" fill="#5c3818"/>
    <circle cx="70" cy="45" r="14" fill="#22c55e"/>
  </g>

  <g transform="translate(265, 120)">
    <rect x="0" y="32" width="60" height="60" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <polygon points="-4,32 30,0 64,32" fill="#475569"/>
    <rect x="23" y="60" width="14" height="32" fill="#85502c"/>
  </g>

  <!-- 3. Edifícios Comerciais com Terraço Verde (4 a 7 Commits) -->
  <g transform="translate(365, 75)">
    <rect x="0" y="0" width="75" height="137" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <!-- Janelas Envidraçadas -->
    <rect x="8" y="15" width="59" height="110" fill="url(#glassGrad)"/>
    <!-- Terraço com Jardim no Topo -->
    <rect x="5" y="-6" width="65" height="6" fill="#22c55e"/>
    <circle cx="20" cy="-10" r="6" fill="#16a34a"/>
    <circle cx="55" cy="-10" r="6" fill="#16a34a"/>
  </g>

  <!-- 4. Arranha-Céu Central Landmark com Heliponto (8+ Commits) -->
  <g transform="translate(480, 25)">
    <!-- Base -->
    <rect x="0" y="45" width="90" height="142" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <rect x="12" y="60" width="66" height="115" fill="url(#glassGrad)"/>
    <!-- Topo Escalonado -->
    <rect x="15" y="0" width="60" height="45" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
    <!-- Heliponto e Antena Spire -->
    <line x1="70" y1="0" x2="70" y2="-25" stroke="#d97706" stroke-width="3"/>
    <circle cx="70" cy="-25" r="3" fill="#ef4444"/>
    <text x="45" y="28" font-family="'Inter', sans-serif" font-weight="bold" font-size="20" fill="#ffffff" text-anchor="middle">H</text>
  </g>

  <!-- 5. Mais Edifícios e Casas à Direita -->
  <g transform="translate(610, 85)">
    <rect x="0" y="0" width="70" height="127" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <rect x="8" y="15" width="54" height="100" fill="url(#glassGrad)"/>
    <rect x="5" y="-5" width="60" height="5" fill="#22c55e"/>
  </g>

  <g transform="translate(720, 125)">
    <rect x="0" y="30" width="55" height="57" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <polygon points="-4,30 27.5,2 59,30" fill="#a84824"/>
    <rect x="20" y="55" width="15" height="32" fill="#85502c"/>
  </g>

  <g transform="translate(815, 140)">
    <rect x="0" y="28" width="50" height="44" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <polygon points="-4,28 25,0 54,28" fill="#475569"/>
  </g>

  <g transform="translate(900, 160)">
    <rect x="0" y="38" width="60" height="14" rx="2" fill="#86efac"/>
    <circle cx="25" cy="20" r="13" fill="#22c55e"/>
    <circle cx="48" cy="22" r="10" fill="#16a34a"/>
  </g>

  <!-- PÓRTICO DO DISTRITO EM DESTAQUE (Corrigido e Elevado) -->
  <g transform="translate(500, 20)">
    <rect x="-130" y="0" width="260" height="30" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="2" filter="url(#cardShadow)"/>
    <text x="0" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="13.5" fill="#0f172a" text-anchor="middle" letter-spacing="1">
      🏛️ DISTRITO DE OUTUBRO
    </text>
  </g>

  <!-- Title Badge Overlay no Rodapé (Formal, Elegante e com Folga Perfeita) -->
  <g transform="translate(500, 288)">
    <rect x="-350" y="-19" width="700" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="0" y="6" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14.5" fill="#0f172a" text-anchor="middle" letter-spacing="0.5">
      🏙️ QA CITY // CLIQUE PARA EXPLORAR A CIDADE NO NAVEGADOR ➔
    </text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#04060d"/>
      <stop offset="60%" stop-color="#0a1024"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>

    <linearGradient id="towerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#001428" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00f0ff" stroke-width="0.5" stroke-opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Sky Background -->
  <rect width="1000" height="320" fill="url(#skyGrad)"/>

  <!-- Perspective Grid Floor -->
  <g opacity="0.7">
    <rect y="210" width="1000" height="110" fill="#04060f"/>
    <!-- Perspective horizontal lines -->
    <line x1="0" y1="210" x2="1000" y2="210" stroke="#00f0ff" stroke-width="1.5" opacity="0.4"/>
    <line x1="0" y1="225" x2="1000" y2="225" stroke="#00f0ff" stroke-width="1" opacity="0.3"/>
    <line x1="0" y1="245" x2="1000" y2="245" stroke="#00f0ff" stroke-width="1.2" opacity="0.4"/>
    <line x1="0" y1="275" x2="1000" y2="275" stroke="#00f0ff" stroke-width="1.8" opacity="0.6"/>
    <line x1="0" y1="318" x2="1000" y2="318" stroke="#00f0ff" stroke-width="2.5" opacity="0.8"/>

    <!-- Perspective vanishing lines toward center horizon (500, 210) -->
    <line x1="500" y1="210" x2="-200" y2="320" stroke="#00f0ff" stroke-width="1" opacity="0.4"/>
    <line x1="500" y1="210" x2="50" y2="320" stroke="#00f0ff" stroke-width="1" opacity="0.4"/>
    <line x1="500" y1="210" x2="250" y2="320" stroke="#00f0ff" stroke-width="1.2" opacity="0.5"/>
    <line x1="500" y1="210" x2="420" y2="320" stroke="#00f0ff" stroke-width="1.5" opacity="0.7"/>
    <line x1="500" y1="210" x2="580" y2="320" stroke="#00f0ff" stroke-width="1.5" opacity="0.7"/>
    <line x1="500" y1="210" x2="750" y2="320" stroke="#00f0ff" stroke-width="1.2" opacity="0.5"/>
    <line x1="500" y1="210" x2="950" y2="320" stroke="#00f0ff" stroke-width="1" opacity="0.4"/>
    <line x1="500" y1="210" x2="1200" y2="320" stroke="#00f0ff" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Distant Background Cyber Buildings -->
  <g opacity="0.35">
    <rect x="70" y="110" width="45" height="100" fill="#0c1630"/>
    <rect x="130" y="80" width="55" height="130" fill="#0c1630"/>
    <rect x="230" y="130" width="40" height="80" fill="#0c1630"/>
    <rect x="330" y="90" width="50" height="120" fill="#0c1630"/>
    <rect x="620" y="75" width="60" height="135" fill="#0c1630"/>
    <rect x="730" y="115" width="45" height="95" fill="#0c1630"/>
    <rect x="820" y="85" width="50" height="125" fill="#0c1630"/>
  </g>

  <!-- Main Tech Towers (The 5 QA Landmarks) -->
  <!-- Tower 1: Playwright Citadel -->
  <g transform="translate(100, 45)">
    <polygon points="40,0 75,30 75,165 5,165 5,30" fill="#0a1226" stroke="#2ead33" stroke-width="1.5"/>
    <line x1="40" y1="0" x2="40" y2="165" stroke="#2ead33" stroke-width="1" opacity="0.6"/>
    <!-- Windows -->
    <rect x="18" y="50" width="12" height="4" fill="#2ead33" opacity="0.8"/>
    <rect x="50" y="50" width="12" height="4" fill="#2ead33" opacity="0.8"/>
    <rect x="18" y="75" width="12" height="4" fill="#00f0ff" opacity="0.8"/>
    <rect x="50" y="75" width="12" height="4" fill="#00f0ff" opacity="0.8"/>
    <rect x="18" y="100" width="12" height="4" fill="#2ead33" opacity="0.8"/>
    <rect x="50" y="100" width="12" height="4" fill="#2ead33" opacity="0.8"/>
    <!-- Glowing Beacon -->
    <circle cx="40" cy="0" r="4" fill="#2ead33" filter="url(#glow)"/>
    <text x="40" y="180" font-family="'Fira Code', monospace" font-size="9" fill="#2ead33" text-anchor="middle" font-weight="bold">PLAYWRIGHT E2E</text>
  </g>

  <!-- Tower 2: Cypress Matrix Hub -->
  <g transform="translate(260, 60)">
    <rect x="0" y="0" width="70" height="150" fill="#080e1c" stroke="#00f0ff" stroke-width="1.5"/>
    <!-- Slices -->
    <line x1="0" y1="35" x2="70" y2="35" stroke="#00f0ff" stroke-width="2" filter="url(#glow)"/>
    <line x1="0" y1="75" x2="70" y2="75" stroke="#00f0ff" stroke-width="2" filter="url(#glow)"/>
    <line x1="0" y1="115" x2="70" y2="115" stroke="#00f0ff" stroke-width="2" filter="url(#glow)"/>
    <circle cx="35" cy="-2" r="4" fill="#00f0ff" filter="url(#glow)"/>
    <text x="35" y="165" font-family="'Fira Code', monospace" font-size="9" fill="#00f0ff" text-anchor="middle" font-weight="bold">CYPRESS MATRIX</text>
  </g>

  <!-- Tower 3: CTFL Academy Central Monolith (Tallest) -->
  <g transform="translate(450, 15)">
    <polygon points="50,0 90,35 90,195 10,195 10,35" fill="#0e1529" stroke="#ffd700" stroke-width="2"/>
    <!-- Central Beam -->
    <line x1="50" y1="0" x2="50" y2="195" stroke="#ffd700" stroke-width="1.5" opacity="0.7"/>
    <!-- Floating Crown Ring -->
    <ellipse cx="50" cy="35" rx="46" ry="10" fill="none" stroke="#00f0ff" stroke-width="2" filter="url(#glow)"/>
    <circle cx="50" cy="0" r="5" fill="#ffd700" filter="url(#glow)"/>
    <text x="50" y="210" font-family="'Fira Code', monospace" font-size="10" fill="#ffd700" text-anchor="middle" font-weight="bold">ISTQB ACADEMY</text>
  </g>

  <!-- Tower 4: k6 Performance Reactor -->
  <g transform="translate(670, 50)">
    <path d="M 15 30 Q 40 20 65 30 L 70 160 Q 40 170 10 160 Z" fill="#140a24" stroke="#7d64ff" stroke-width="1.5"/>
    <ellipse cx="40" cy="30" rx="25" ry="8" fill="none" stroke="#ff0055" stroke-width="2" filter="url(#glow)"/>
    <ellipse cx="40" cy="80" rx="27" ry="9" fill="none" stroke="#7d64ff" stroke-width="2" filter="url(#glow)"/>
    <ellipse cx="40" cy="130" rx="29" ry="10" fill="none" stroke="#ff0055" stroke-width="2" filter="url(#glow)"/>
    <circle cx="40" cy="22" r="4" fill="#ff0055" filter="url(#glow)"/>
    <text x="40" y="175" font-family="'Fira Code', monospace" font-size="9" fill="#7d64ff" text-anchor="middle" font-weight="bold">k6 REACTOR</text>
  </g>

  <!-- Tower 5: ServeRest API Spire -->
  <g transform="translate(830, 40)">
    <polygon points="35,0 65,170 5,170" fill="#170c08" stroke="#ff6c37" stroke-width="1.5"/>
    <line x1="35" y1="0" x2="35" y2="170" stroke="#ff6c37" stroke-width="1" opacity="0.8"/>
    <line x1="35" y1="-20" x2="35" y2="0" stroke="#00f0ff" stroke-width="2" filter="url(#glow)"/>
    <circle cx="35" cy="-20" r="4" fill="#00f0ff" filter="url(#glow)"/>
    <text x="35" y="185" font-family="'Fira Code', monospace" font-size="9" fill="#ff6c37" text-anchor="middle" font-weight="bold">API CONTRACTS</text>
  </g>

  <!-- Neon Flying Vehicle & Cyber Car in Foreground -->
  <!-- Flying Drone / Jet -->
  <g transform="translate(380, 80) scale(0.7)">
    <polygon points="0,-15 25,15 -25,15" fill="#00f0ff" opacity="0.9" filter="url(#glow)"/>
    <!-- Jet Trails -->
    <line x1="-12" y1="15" x2="-12" y2="45" stroke="#00f0ff" stroke-width="3" opacity="0.6"/>
    <line x1="12" y1="15" x2="12" y2="45" stroke="#00f0ff" stroke-width="3" opacity="0.6"/>
  </g>

  <!-- Cyber Rover / Car on Road -->
  <g transform="translate(475, 255) scale(0.9)">
    <rect x="0" y="0" width="50" height="22" rx="4" fill="#060a17" stroke="#00f0ff" stroke-width="1.5"/>
    <rect x="8" y="-12" width="34" height="14" rx="2" fill="#00f0ff" opacity="0.75"/>
    <!-- Headlight beams -->
    <polygon points="4,22 -35,55 85,55 46,22" fill="#00f0ff" opacity="0.15"/>
    <circle cx="6" cy="22" r="3" fill="#00f0ff" filter="url(#glow)"/>
    <circle cx="44" cy="22" r="3" fill="#00f0ff" filter="url(#glow)"/>
  </g>

  <!-- Title Badge Overlay -->
  <g transform="translate(500, 290)">
    <rect x="-240" y="-18" width="480" height="36" rx="6" fill="#070b1a" stroke="#00f0ff" stroke-width="1.5" filter="url(#glow)"/>
    <text x="0" y="6" font-family="'Rajdhani', sans-serif" font-weight="bold" font-size="16" fill="#00f0ff" text-anchor="middle" letter-spacing="3">
      ⚡ QA DEVCITY 3D // CLIQUE PARA EXPLORAR NO NAVEGADOR ⚡
    </text>
  </g>
</svg>

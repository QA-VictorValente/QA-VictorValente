<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#060b18"/>
      <stop offset="60%" stop-color="#0f1c3d"/>
      <stop offset="100%" stop-color="#091226"/>
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Sky Background (Mais clara e visível) -->
  <rect width="1000" height="320" fill="url(#skyGrad)"/>

  <!-- Perspective Grid Floor -->
  <g opacity="0.8">
    <rect y="200" width="1000" height="120" fill="#080e22"/>
    <!-- Horizontal avenue lines -->
    <line x1="0" y1="200" x2="1000" y2="200" stroke="#00f0ff" stroke-width="1.8" opacity="0.6"/>
    <line x1="0" y1="218" x2="1000" y2="218" stroke="#00f0ff" stroke-width="1.5" opacity="0.5"/>
    <line x1="0" y1="240" x2="1000" y2="240" stroke="#00f0ff" stroke-width="1.6" opacity="0.6"/>
    <line x1="0" y1="270" x2="1000" y2="270" stroke="#00f0ff" stroke-width="2.0" opacity="0.75"/>
    <line x1="0" y1="316" x2="1000" y2="316" stroke="#00f0ff" stroke-width="2.8" opacity="0.9"/>

    <!-- Perspective vanishing lines toward center horizon (500, 200) -->
    <line x1="500" y1="200" x2="-200" y2="320" stroke="#00f0ff" stroke-width="1.2" opacity="0.5"/>
    <line x1="500" y1="200" x2="50" y2="320" stroke="#00f0ff" stroke-width="1.2" opacity="0.5"/>
    <line x1="500" y1="200" x2="250" y2="320" stroke="#00f0ff" stroke-width="1.5" opacity="0.6"/>
    <line x1="500" y1="200" x2="420" y2="320" stroke="#00f0ff" stroke-width="1.8" opacity="0.8"/>
    <line x1="500" y1="200" x2="580" y2="320" stroke="#00f0ff" stroke-width="1.8" opacity="0.8"/>
    <line x1="500" y1="200" x2="750" y2="320" stroke="#00f0ff" stroke-width="1.5" opacity="0.6"/>
    <line x1="500" y1="200" x2="950" y2="320" stroke="#00f0ff" stroke-width="1.2" opacity="0.5"/>
    <line x1="500" y1="200" x2="1200" y2="320" stroke="#00f0ff" stroke-width="1.2" opacity="0.5"/>
  </g>

  <!-- Skyline of Commit Houses & Towers -->
  <!-- Low Commit Houses (Casas dos dias) -->
  <g opacity="0.7">
    <rect x="30" y="165" width="22" height="35" fill="#14264d" stroke="#00f0ff" stroke-width="0.8"/>
    <rect x="58" y="155" width="26" height="45" fill="#1b366e" stroke="#39d353" stroke-width="0.8"/>
    <rect x="180" y="160" width="24" height="40" fill="#14264d" stroke="#00f0ff" stroke-width="0.8"/>
    <rect x="210" y="150" width="28" height="50" fill="#1b366e" stroke="#39d353" stroke-width="0.8"/>
    <rect x="340" y="160" width="24" height="40" fill="#14264d" stroke="#00f0ff" stroke-width="0.8"/>
    <rect x="620" y="155" width="26" height="45" fill="#1b366e" stroke="#39d353" stroke-width="0.8"/>
    <rect x="750" y="160" width="24" height="40" fill="#14264d" stroke="#00f0ff" stroke-width="0.8"/>
    <rect x="910" y="155" width="26" height="45" fill="#14264d" stroke="#00f0ff" stroke-width="0.8"/>
  </g>

  <!-- Main Towers (Picos de Commits) -->
  <g transform="translate(90, 40)">
    <polygon points="35,0 70,30 70,160 5,160 5,30" fill="#111f3d" stroke="#2ead33" stroke-width="1.8"/>
    <line x1="35" y1="0" x2="35" y2="160" stroke="#2ead33" stroke-width="1" opacity="0.8"/>
    <circle cx="35" cy="0" r="4" fill="#2ead33" filter="url(#glow)"/>
    <text x="35" y="175" font-family="'Fira Code', monospace" font-size="8.5" fill="#2ead33" text-anchor="middle" font-weight="bold">SET / OUT</text>
  </g>

  <g transform="translate(250, 50)">
    <rect x="0" y="0" width="65" height="150" fill="#0d1b38" stroke="#00f0ff" stroke-width="1.8"/>
    <line x1="0" y1="40" x2="65" y2="40" stroke="#00f0ff" stroke-width="2" filter="url(#glow)"/>
    <line x1="0" y1="80" x2="65" y2="80" stroke="#00f0ff" stroke-width="2" filter="url(#glow)"/>
    <line x1="0" y1="120" x2="65" y2="120" stroke="#00f0ff" stroke-width="2" filter="url(#glow)"/>
    <circle cx="32" cy="-2" r="4" fill="#00f0ff" filter="url(#glow)"/>
    <text x="32" y="165" font-family="'Fira Code', monospace" font-size="8.5" fill="#00f0ff" text-anchor="middle" font-weight="bold">JUL / AGO</text>
  </g>

  <g transform="translate(450, 15)">
    <polygon points="50,0 90,35 90,185 10,185 10,35" fill="#1a2747" stroke="#ffd700" stroke-width="2.2"/>
    <line x1="50" y1="0" x2="50" y2="185" stroke="#ffd700" stroke-width="1.8" opacity="0.9"/>
    <ellipse cx="50" cy="35" rx="46" ry="10" fill="none" stroke="#00f0ff" stroke-width="2" filter="url(#glow)"/>
    <circle cx="50" cy="0" r="5" fill="#ffd700" filter="url(#glow)"/>
    <text x="50" y="200" font-family="'Fira Code', monospace" font-size="9.5" fill="#ffd700" text-anchor="middle" font-weight="bold">ISTQB MONUMENT</text>
  </g>

  <g transform="translate(680, 45)">
    <path d="M 15 30 Q 40 20 65 30 L 70 155 Q 40 165 10 155 Z" fill="#1b1238" stroke="#7d64ff" stroke-width="1.8"/>
    <ellipse cx="40" cy="30" rx="25" ry="8" fill="none" stroke="#ff0055" stroke-width="2" filter="url(#glow)"/>
    <ellipse cx="40" cy="80" rx="27" ry="9" fill="none" stroke="#7d64ff" stroke-width="2" filter="url(#glow)"/>
    <circle cx="40" cy="22" r="4" fill="#ff0055" filter="url(#glow)"/>
    <text x="40" y="170" font-family="'Fira Code', monospace" font-size="8.5" fill="#7d64ff" text-anchor="middle" font-weight="bold">MAI / JUN</text>
  </g>

  <g transform="translate(840, 40)">
    <polygon points="35,0 65,160 5,160" fill="#24140c" stroke="#ff6c37" stroke-width="1.8"/>
    <line x1="35" y1="0" x2="35" y2="160" stroke="#ff6c37" stroke-width="1.2" opacity="0.9"/>
    <circle cx="35" cy="-10" r="4" fill="#00f0ff" filter="url(#glow)"/>
    <text x="35" y="175" font-family="'Fira Code', monospace" font-size="8.5" fill="#ff6c37" text-anchor="middle" font-weight="bold">MAR / ABR</text>
  </g>

  <!-- Flying Jet in Sky -->
  <g transform="translate(360, 65) scale(0.85)">
    <polygon points="0,-18 28,18 -28,18" fill="#00f0ff" filter="url(#glow)"/>
    <line x1="-14" y1="18" x2="-14" y2="50" stroke="#00f0ff" stroke-width="3.5" opacity="0.8"/>
    <line x1="14" y1="18" x2="14" y2="50" stroke="#00f0ff" stroke-width="3.5" opacity="0.8"/>
  </g>

  <!-- Cyber Rover / Car on Road -->
  <g transform="translate(470, 245) scale(1.05)">
    <rect x="0" y="0" width="56" height="24" rx="4" fill="#09142b" stroke="#00f0ff" stroke-width="2"/>
    <rect x="10" y="-12" width="36" height="14" rx="2" fill="#00f0ff" opacity="0.85"/>
    <polygon points="5,24 -40,65 96,65 51,24" fill="#00f0ff" opacity="0.22"/>
    <circle cx="7" cy="24" r="3.5" fill="#00f0ff" filter="url(#glow)"/>
    <circle cx="49" cy="24" r="3.5" fill="#00f0ff" filter="url(#glow)"/>
  </g>

  <!-- Title Badge Overlay (Retângulo Ajustado para Englobar Tudo com Folga) -->
  <g transform="translate(500, 290)">
    <rect x="-360" y="-19" width="720" height="38" rx="8" fill="#070c1f" stroke="#00f0ff" stroke-width="2" filter="url(#glow)"/>
    <text x="0" y="6" font-family="'Rajdhani', sans-serif" font-weight="bold" font-size="15" fill="#00f0ff" text-anchor="middle" letter-spacing="2">
      ⚡ QA DEVCITY 3D // CLIQUE PARA EXPLORAR NO NAVEGADOR ⚡
    </text>
  </g>
</svg>
